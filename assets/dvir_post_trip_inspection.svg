<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="dvirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#dvirBg)" rx="12"/>
  <rect width="958" height="518" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="40" height="32" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">📝</text>
    <text x="52" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.01em">DOT 49 CFR § 396.11 • POST-TRIP INSPECTION (DVIR) PROTOCOL</text>
    <text x="52" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">End-of-Shift Walkaround, Moisture Purge, Defect Severity Classification &amp; Samsara e-DVIR</text>
  </g>

  <!-- 4 Step Detailed Panels -->

  <!-- Panel 1: Post-Trip Walkaround -->
  <g transform="translate(32, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#1e293b"/>
    <text x="12" y="20" fill="#38bdf8" font-family="system-ui" font-size="10.5" font-weight="800">1. END-OF-SHIFT CHECK</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#f8fafc">Tire &amp; Wheel Inspection:</text>
      <text x="0" y="27">• Check tire temperature (heat)</text>
      <text x="0" y="42">• Look for embedded nails/screws</text>
      <text x="0" y="57">• Inspect wheel seals for leaks</text>
      <text x="0" y="72">• Check dual tire spacing</text>

      <line x1="0" y1="84" x2="188" y2="84" stroke="#1e293b"/>

      <text x="0" y="100" font-weight="700" fill="#f8fafc">Trailer &amp; Cargo Doors:</text>
      <text x="0" y="115">• Inspect door hinges &amp; latches</text>
      <text x="0" y="130">• Check cargo seal integrity</text>
      <text x="0" y="145">• Verify tail lights &amp; marker lamps</text>
      <text x="0" y="160">• Inspect rear bumper &amp; underride</text>

      <line x1="0" y1="172" x2="188" y2="172" stroke="#1e293b"/>

      <text x="0" y="188" font-weight="700" fill="#f8fafc">Cab &amp; Exterior:</text>
      <text x="0" y="203">• Look for new windshield chips</text>
      <text x="0" y="218">• Check mudflap attachments</text>
      <text x="0" y="233">• Confirm exhaust/DEF clear</text>
    </g>
  </g>

  <!-- Panel 2: Air Tank Moisture Purge -->
  <g transform="translate(260, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#1e293b"/>
    <text x="12" y="20" fill="#38bdf8" font-family="system-ui" font-size="10.5" font-weight="800">2. AIR TANK PURGE</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#38bdf8">Mandatory Daily Purge:</text>
      <text x="0" y="27">• Locate 3 drain lanyards under</text>
      <text x="0" y="40">  the driver-side cab battery box /</text>
      <text x="0" y="53">  fuel tank steps.</text>

      <line x1="0" y1="65" x2="188" y2="65" stroke="#1e293b"/>

      <text x="0" y="80" font-weight="700" fill="#f8fafc">Tanks to Drain:</text>
      <text x="0" y="95">1. Wet Tank (Supply reservoir)</text>
      <text x="0" y="110">2. Primary Air Reservoir</text>
      <text x="0" y="125">3. Secondary Air Reservoir</text>

      <line x1="0" y1="137" x2="188" y2="137" stroke="#1e293b"/>

      <text x="0" y="152" font-weight="700" fill="#f59e0b">Inspection Criteria:</text>
      <text x="0" y="167">• Pull each lanyard until hiss is</text>
      <text x="0" y="180">  100% dry air with NO moisture,</text>
      <text x="0" y="193">  sludge, or oil discharge.</text>
      <text x="0" y="210" fill="#ef4444">• Oil spray indicates failed</text>
      <text x="0" y="223" fill="#ef4444">  air compressor / dryer filter!</text>
      <text x="0" y="240" fill="#38bdf8">• In winter: prevents frozen</text>
      <text x="0" y="253" fill="#38bdf8">  valves and brake lockups.</text>
    </g>
  </g>

  <!-- Panel 3: Defect Severity Classification -->
  <g transform="translate(488, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#1e293b"/>
    <text x="12" y="20" fill="#38bdf8" font-family="system-ui" font-size="10.5" font-weight="800">3. DEFECT SEVERITY</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <rect x="0" y="0" width="188" height="22" rx="4" fill="rgba(239,68,68,0.2)"/>
      <text x="8" y="15" font-weight="800" fill="#f87171">🚨 OUT-OF-SERVICE (OOS):</text>
      <text x="0" y="36" font-weight="700" fill="#fca5a5">Ground unit immediately:</text>
      <text x="0" y="51">• Audible air brake line leak</text>
      <text x="0" y="66">• Brake lining &lt; 1/4" thickness</text>
      <text x="0" y="81">• Steer tire cut, bulge, or ply exposed</text>
      <text x="0" y="96">• Windshield crack in wiper sweep</text>
      <text x="0" y="111">• Headlight or turn signal inoperable</text>
      <text x="0" y="126">• Steering free-play &gt; 2.25 inches</text>

      <line x1="0" y1="138" x2="188" y2="138" stroke="#1e293b"/>

      <rect x="0" y="148" width="188" height="22" rx="4" fill="rgba(234,179,8,0.15)"/>
      <text x="8" y="163" font-weight="800" fill="#fbbf24">⚠️ MINOR DEFECT (PM):</text>
      <text x="0" y="184" font-weight="700" fill="#fde047">Drivable, schedule shop:</text>
      <text x="0" y="199">• Clearance marker lamp burnt</text>
      <text x="0" y="214">• Bunk heater intermittent</text>
      <text x="0" y="229">• Minor splash guard chip</text>
      <text x="0" y="244">• Mirror bracket looseness</text>
    </g>
  </g>

  <!-- Panel 4: Samsara e-DVIR Submission -->
  <g transform="translate(716, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#09251d"/>
    <rect width="212" height="2" y="29" fill="#10b981"/>
    <text x="12" y="20" fill="#34d399" font-family="system-ui" font-size="10.5" font-weight="800">4. SAMSARA E-DVIR</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#34d399">In Driver Mobile App:</text>
      <text x="0" y="27">1. Tap "DVIR" icon</text>
      <text x="0" y="42">2. Confirm Tractor &amp; Trailer ID</text>
      <text x="0" y="57">3. Select "End-of-Day DVIR"</text>

      <line x1="0" y1="69" x2="188" y2="69" stroke="#133829"/>

      <text x="0" y="85" font-weight="700" fill="#34d399">If Defects Found:</text>
      <text x="0" y="100">• Tap "+ Add Defect"</text>
      <text x="0" y="115">• Select component (Brakes, Tires)</text>
      <text x="0" y="130">• Take close-up photos in app</text>
      <text x="0" y="145">• Add detailed description</text>

      <line x1="0" y1="157" x2="188" y2="157" stroke="#133829"/>

      <text x="0" y="173" font-weight="700" fill="#34d399">Certification &amp; Sign:</text>
      <text x="0" y="188">• Driver digital signature</text>
      <text x="0" y="203">• Shop mechanic repair sign-off</text>
      <text x="0" y="218">• Next driver reviews &amp; certifies</text>
      <text x="0" y="233" fill="#10b981" font-weight="700">✓ FMCSA Compliant Record</text>
    </g>
  </g>
</svg>