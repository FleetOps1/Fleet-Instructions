<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coolantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="320" fill="#0b1120" rx="12"/>
  <rect x="10" y="10" width="480" height="300" fill="#131c31" rx="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="250" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Freightliner Cascadia Coolant Surge Tank</text>
  <text x="250" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Driver Side Under Hood • Inspect Cold</text>

  <!-- Tank Body (Translucent Plastic) -->
  <rect x="120" y="80" width="260" height="180" rx="16" fill="url(#tankGrad)" stroke="#64748b" stroke-width="2"/>
  
  <!-- Coolant Liquid Level -->
  <rect x="122" y="150" width="256" height="108" rx="8" fill="url(#coolantGrad)"/>
  
  <!-- Min / Max Level Markings -->
  <line x1="100" y1="130" x2="140" y2="130" stroke="#38bdf8" stroke-width="3"/>
  <text x="90" y="134" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="end">MAX COLD</text>

  <line x1="100" y1="170" x2="140" y2="170" stroke="#ef4444" stroke-width="3"/>
  <text x="90" y="174" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="end">MIN COLD</text>

  <!-- Fill Cap -->
  <rect x="220" y="62" width="60" height="18" rx="4" fill="url(#capGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f59e0b" text-anchor="middle">15 PSI CAP</text>

  <!-- Warning Label -->
  <rect x="150" y="270" width="200" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="250" y="287" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fecaca" text-anchor="middle">⚠️ DO NOT OPEN WHEN HOT!</text>

  <!-- Level Sensor Port -->
  <circle cx="360" cy="180" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <line x1="368" y1="180" x2="410" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="415" y="184" font-family="sans-serif" font-size="11" fill="#38bdf8">Level Sensor</text>

  <!-- Bottom Hose -->
  <rect x="235" y="260" width="30" height="20" fill="#334155" stroke="#475569"/>
  <line x1="265" y1="270" x2="410" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="415" y="244" font-family="sans-serif" font-size="11" fill="#94a3b8">To Water Pump</text>
</svg>
