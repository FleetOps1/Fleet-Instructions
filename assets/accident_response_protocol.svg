<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="accBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="460" fill="url(#accBg)" rx="12"/>
  <rect width="918" height="458" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="40" height="28" rx="6" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="19" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">🚨</text>
    <text x="52" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.01em">COMMERCIAL VEHICLE ACCIDENT &amp; CRASH EMERGENCY PROTOCOL</text>
    <text x="52" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">DOT 49 CFR § 382.303 / § 390.15 • Scene Preservation, Photo Checklist &amp; FMCSA Compliance</text>
  </g>

  <!-- 3 Action Column Cards -->

  <!-- Panel 1: Scene Safety & Police Dispatch -->
  <g transform="translate(32, 78)">
    <rect width="268" height="348" rx="10" fill="url(#cardGrad)" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
    <rect width="268" height="34" rx="10" fill="#1f1520"/>
    <rect width="268" height="2" y="33" fill="#ef4444"/>
    <text x="16" y="22" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.04em">1. SCENE SAFETY &amp; 911 CALL</text>

    <!-- Sub items -->
    <g transform="translate(16, 50)" font-family="system-ui, sans-serif" font-size="11">
      <circle cx="8" cy="8" r="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
      <text x="8" y="12" fill="#f87171" font-weight="800" font-size="10" text-anchor="middle">A</text>
      <text x="24" y="12" fill="#e2e8f0" font-weight="700">Stop Tractor &amp; Set Air Brakes</text>
      <text x="24" y="27" fill="#94a3b8" font-size="10">Turn ON 4-way hazard flashers immediately.</text>

      <g transform="translate(0, 42)">
        <circle cx="8" cy="8" r="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
        <text x="8" y="12" fill="#f87171" font-weight="800" font-size="10" text-anchor="middle">B</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Deploy 3 Safety Triangles</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Place within 10 min: 10ft, 100ft &amp; 200ft back.</text>
      </g>

      <g transform="translate(0, 84)">
        <circle cx="8" cy="8" r="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
        <text x="8" y="12" fill="#f87171" font-weight="800" font-size="10" text-anchor="middle">C</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Call 911 for Police &amp; EMS</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Request officer crash report and medical aid.</text>
      </g>

      <g transform="translate(0, 126)">
        <circle cx="8" cy="8" r="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
        <text x="8" y="12" fill="#f87171" font-weight="800" font-size="10" text-anchor="middle">D</text>
        <text x="24" y="12" fill="#fca5a5" font-weight="800">NEVER ADMIT FAULT</text>
        <text x="24" y="27" fill="#cbd5e1" font-size="10">Do not apologize or speculate on speeds.</text>
        <text x="24" y="40" fill="#94a3b8" font-size="9.5">Provide CDL, registration &amp; fleet cab card only.</text>
      </g>

      <g transform="translate(0, 182)">
        <rect x="0" y="0" width="236" height="48" rx="6" fill="#17111b" stroke="#ef4444" stroke-width="1"/>
        <text x="12" y="18" fill="#fca5a5" font-weight="800" font-size="10.5">📞 IMMEDIATE FLEET NOTIFICATION</text>
        <text x="12" y="34" fill="#cbd5e1" font-size="10">Call Company Safety &amp; Dispatcher 24/7</text>
      </g>
    </g>
  </g>

  <!-- Panel 2: 360° Photo Evidence Checklist -->
  <g transform="translate(326, 78)">
    <rect width="268" height="348" rx="10" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <rect width="268" height="34" rx="10" fill="#0c1d2e"/>
    <rect width="268" height="2" y="33" fill="#38bdf8"/>
    <text x="16" y="22" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.04em">2. 360° EVIDENCE &amp; INFO EXCHANGE</text>

    <!-- Sub items -->
    <g transform="translate(16, 50)" font-family="system-ui, sans-serif" font-size="11">
      <circle cx="8" cy="8" r="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
      <text x="8" y="12" fill="#38bdf8" font-weight="800" font-size="10" text-anchor="middle">1</text>
      <text x="24" y="12" fill="#e2e8f0" font-weight="700">4-Corner Wide Scene Shots</text>
      <text x="24" y="27" fill="#94a3b8" font-size="10">Position of all vehicles before towing or moving.</text>

      <g transform="translate(0, 42)">
        <circle cx="8" cy="8" r="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
        <text x="8" y="12" fill="#38bdf8" font-weight="800" font-size="10" text-anchor="middle">2</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Close-ups of All Impact Points</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Tractor bumper, steer axle, steer tires, other car.</text>
      </g>

      <g transform="translate(0, 84)">
        <circle cx="8" cy="8" r="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
        <text x="8" y="12" fill="#38bdf8" font-weight="800" font-size="10" text-anchor="middle">3</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Skid Marks, Debris &amp; Signs</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Road conditions, wet pavement, traffic lights.</text>
      </g>

      <g transform="translate(0, 126)">
        <circle cx="8" cy="8" r="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
        <text x="8" y="12" fill="#38bdf8" font-weight="800" font-size="10" text-anchor="middle">4</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Other Driver's License &amp; Plate</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Clear photo of driver's license, insurance &amp; VIN.</text>
      </g>

      <g transform="translate(0, 168)">
        <circle cx="8" cy="8" r="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1"/>
        <text x="8" y="12" fill="#38bdf8" font-weight="800" font-size="10" text-anchor="middle">5</text>
        <text x="24" y="12" fill="#e2e8f0" font-weight="700">Police Report &amp; Badge #</text>
        <text x="24" y="27" fill="#94a3b8" font-size="10">Officer name, badge, and crash report ID card.</text>
      </g>

      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="236" height="34" rx="6" fill="#0b1728" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="12" y="21" fill="#7dd3fc" font-size="10" font-weight="700">📹 Samsara Dashcam clip locked to portal</text>
      </g>
    </g>
  </g>

  <!-- Panel 3: DOT Testing & Towing Protocols -->
  <g transform="translate(620, 78)">
    <rect width="268" height="348" rx="10" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <rect width="268" height="34" rx="10" fill="#241a0b"/>
    <rect width="268" height="2" y="33" fill="#f59e0b"/>
    <text x="16" y="22" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.04em">3. DOT TESTING &amp; TOW RULES</text>

    <g transform="translate(16, 50)" font-family="system-ui, sans-serif" font-size="11">
      <text x="0" y="12" fill="#fbbf24" font-weight="800" font-size="11">DOT MANDATORY TESTING TRIGGERS:</text>
      
      <rect x="0" y="22" width="236" height="54" rx="6" fill="#18130c" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
      <text x="10" y="38" fill="#f8fafc" font-size="10" font-weight="700">🔴 Any Fatality:</text>
      <text x="96" y="38" fill="#f87171" font-size="10">Always Mandatory</text>
      <text x="10" y="52" fill="#f8fafc" font-size="10" font-weight="700">🟡 Injury with Citation:</text>
      <text x="126" y="52" fill="#fbbf24" font-size="10">Mandatory</text>
      <text x="10" y="66" fill="#f8fafc" font-size="10" font-weight="700">🟡 Disabling Tow + Citation:</text>
      <text x="156" y="66" fill="#fbbf24" font-size="10">Mandatory</text>

      <g transform="translate(0, 88)">
        <text x="0" y="12" fill="#e2e8f0" font-weight="700">Testing Timelines (49 CFR § 382.303):</text>
        <text x="0" y="28" fill="#94a3b8" font-size="10">• Alcohol Screen: within 2 hrs (max 8 hrs)</text>
        <text x="0" y="42" fill="#94a3b8" font-size="10">• Urine Drug Screen: within 32 hours</text>
      </g>

      <g transform="translate(0, 146)">
        <rect x="0" y="0" width="236" height="88" rx="6" fill="#1f120c" stroke="#f97316" stroke-width="1"/>
        <text x="10" y="18" fill="#fdba74" font-weight="800" font-size="10.5">⚠️ DT12 TRANSMISSION TOW RULE</text>
        <text x="10" y="34" fill="#fed7aa" font-size="9.5">NEVER allow wrecker to tow truck with</text>
        <text x="10" y="47" fill="#fed7aa" font-size="9.5">drive wheels on ground without pulling</text>
        <text x="10" y="60" fill="#f87171" font-weight="700" font-size="10">BOTH rear axle half-shafts!</text>
        <text x="10" y="75" fill="#94a3b8" font-size="9">Lack of oil circulation burns transmission gears.</text>
      </g>
    </g>
  </g>
</svg>