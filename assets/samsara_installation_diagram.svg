<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="samsaraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="url(#samsaraBg)" rx="12"/>
  <rect width="878" height="438" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">SAMSARA VEHICLE GATEWAY (VG54) &amp; DASHCAM INSTALLATION</text>
  <text x="32" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Freightliner Cascadia RP1226 Diagnostic Port &amp; Windshield Mounting Protocol</text>

  <!-- Section 1: RP1226 Port Location -->
  <g transform="translate(32, 90)">
    <rect width="250" height="310" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="34" rx="10" fill="#1e293b"/>
    <text x="125" y="22" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">STEP 1: RP1226 CONNECTOR</text>

    <!-- Truck Cab Footwell Graphic -->
    <path d="M 25,60 L 225,60 L 225,180 L 160,200 L 25,200 Z" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <!-- Kick panel -->
    <rect x="130" y="90" width="80" height="90" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="3,3" rx="4"/>
    <text x="170" y="130" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Behind Lower</text>
    <text x="170" y="144" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Passenger Kick</text>

    <!-- RP1226 Pinout Icon -->
    <rect x="75" y="215" width="100" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="238" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="11" text-anchor="middle">14-PIN RP1226</text>
    <text x="125" y="280" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Standard on 2017+ Cascadia</text>
    <text x="125" y="296" fill="#94a3b8" font-family="system-ui" font-size="9" text-anchor="middle">Direct plug &amp; lock harness</text>
  </g>

  <!-- Connecting Cable 1 -->
  <path d="M 282,310 C 300,310 300,240 315,240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Section 2: Samsara Gateway Box -->
  <g transform="translate(315, 90)">
    <rect width="250" height="310" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="34" rx="10" fill="#1e293b"/>
    <text x="125" y="22" fill="#10b981" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">STEP 2: VG54 GATEWAY MOUNT</text>

    <!-- Gateway Box Drawing -->
    <rect x="45" y="65" width="160" height="110" rx="8" fill="url(#gwGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="125" y="95" fill="#f8fafc" font-family="system-ui" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">samsara</text>
    <text x="125" y="112" fill="#64748b" font-family="system-ui" font-size="9" text-anchor="middle">THIS SIDE FACES SKY ↑</text>

    <!-- Status LEDs on Gateway -->
    <g transform="translate(65, 135)">
      <circle cx="15" cy="15" r="7" fill="#10b981"/>
      <circle cx="15" cy="15" r="11" fill="none" stroke="#10b981" opacity="0.4"/>
      <text x="35" y="19" fill="#f8fafc" font-family="system-ui" font-size="10" font-weight="600">Green = Active &amp; GPS OK</text>
    </g>

    <!-- Diagnostic LED Guide -->
    <rect x="20" y="190" width="210" height="105" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="30" y="210" fill="#10b981" font-family="system-ui" font-weight="700" font-size="10">● SOLID GREEN:</text>
    <text x="115" y="210" fill="#94a3b8" font-family="system-ui" font-size="9.5">Cellular, GPS &amp; Bus Locked</text>

    <text x="30" y="235" fill="#f59e0b" font-family="system-ui" font-weight="700" font-size="10">● FLASHING ORANGE:</text>
    <text x="145" y="235" fill="#94a3b8" font-family="system-ui" font-size="9.5">Connecting / Booting</text>

    <text x="30" y="260" fill="#ef4444" font-family="system-ui" font-weight="700" font-size="10">● RED / OFF:</text>
    <text x="100" y="260" fill="#94a3b8" font-family="system-ui" font-size="9.5">No Power / Bad Connector Pin</text>

    <text x="125" y="285" fill="#cbd5e1" font-family="system-ui" font-size="9" text-anchor="middle">Mount high in dash for clear sky view</text>
  </g>

  <!-- Connecting Cable 2 -->
  <path d="M 565,160 C 580,160 585,160 598,160" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- Section 3: Windshield Dashcam Mount -->
  <g transform="translate(598, 90)">
    <rect width="250" height="310" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="34" rx="10" fill="#1e293b"/>
    <text x="125" y="22" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">STEP 3: DASHCAM (CM32)</text>

    <!-- Windshield Outline -->
    <path d="M 20,60 L 230,60 L 210,140 L 40,140 Z" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Wiper Sweep Line -->
    <path d="M 40,135 Q 125,75 210,135" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="125" y="128" fill="#38bdf8" font-family="system-ui" font-size="8" text-anchor="middle">WIPER SWEEP ZONE (REQUIRED)</text>

    <!-- Camera Drawing -->
    <rect x="95" y="65" width="60" height="42" rx="6" fill="url(#camGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="115" cy="86" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="115" cy="86" r="4" fill="#0f172a"/>

    <!-- Checklist -->
    <rect x="20" y="160" width="210" height="135" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="32" y="182" fill="#f8fafc" font-family="system-ui" font-weight="700" font-size="10">DOT &amp; Best Practices:</text>
    <text x="32" y="202" fill="#cbd5e1" font-family="system-ui" font-size="9.5">1. Clean glass with alcohol wipe</text>
    <text x="32" y="222" fill="#cbd5e1" font-family="system-ui" font-size="9.5">2. Mount within wiper sweep area</text>
    <text x="32" y="242" fill="#cbd5e1" font-family="system-ui" font-size="9.5">3. Press 3M VHB tape for 30s</text>
    <text x="32" y="262" fill="#cbd5e1" font-family="system-ui" font-size="9.5">4. Route cable under header trim</text>
    <text x="32" y="282" fill="#cbd5e1" font-family="system-ui" font-size="9.5">5. Pair vehicle ID in Driver App</text>
  </g>
</svg>
