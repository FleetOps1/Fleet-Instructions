<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="320" fill="#0b1120" rx="12"/>
  <rect x="10" y="10" width="480" height="300" fill="#131c31" rx="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="250" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Windshield DOT 393.60 Crack &amp; Chip Limits</text>
  <text x="250" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Critical Wiper Sweep Zone vs Allowable Outer Damage</text>

  <!-- Windshield Outer Frame -->
  <path d="M 50 250 L 80 100 L 420 100 L 450 250 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <path d="M 60 240 L 86 110 L 414 110 L 440 240 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Divider Post (Cascadia 2-piece windshield) -->
  <line x1="250" y1="105" x2="250" y2="245" stroke="#475569" stroke-width="4"/>

  <!-- Driver Side (Left) Wiper Sweep Arc -->
  <path d="M 90 230 A 130 130 0 0 1 240 120" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Critical Zone (8.5" x 11" above steering wheel) -->
  <rect x="120" y="130" width="85" height="90" rx="4" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="2"/>
  <text x="162" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">CRITICAL</text>
  <text x="162" y="185" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fca5a5" text-anchor="middle">ZONE</text>
  <text x="162" y="200" font-family="sans-serif" font-size="8" fill="#fecaca" text-anchor="middle">8.5" x 11" Area</text>

  <!-- Steering Wheel Reference below -->
  <circle cx="162" cy="275" r="22" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="162" y1="253" x2="162" y2="297" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="275" x2="184" y2="275" stroke="#64748b" stroke-width="2"/>
  <text x="162" y="308" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Steering Wheel Center</text>

  <!-- Left Side Label: Out of Service -->
  <line x1="120" y1="145" x2="70" y2="145" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="142" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">❌ NO CRACKS</text>
  <text x="65" y="155" font-family="sans-serif" font-size="8" fill="#fca5a5" text-anchor="end">Instant DOT OOS</text>

  <!-- Right Side / Passenger Allowed Chip Illustration -->
  <circle cx="340" cy="160" r="10" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="340" y="164" font-size="12" text-anchor="middle">💥</text>
  <line x1="352" y1="160" x2="430" y2="160" stroke="#10b981" stroke-width="1.5"/>
  <text x="435" y="158" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">✅ ALLOWABLE</text>
  <text x="435" y="172" font-family="sans-serif" font-size="8" fill="#a7f3d0">Single chip &lt; 3/4"</text>
  <text x="435" y="184" font-family="sans-serif" font-size="8" fill="#94a3b8">&gt; 3" from other cracks</text>

  <!-- Intersecting Spider Crack Warning on Bottom Right -->
  <text x="340" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">⚠️ INTERSECTING CRACKS</text>
  <text x="340" y="290" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">2 cracks touching = Automatic violation</text>
</svg>
