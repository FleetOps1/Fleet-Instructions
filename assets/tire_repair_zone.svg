<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="320" fill="#0b1120" rx="12"/>
  <rect x="10" y="10" width="480" height="300" fill="#131c31" rx="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="250" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Truck Tire Repairable Zone (Nail / Screw)</text>
  <text x="250" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Crown vs Shoulder &amp; Sidewall DOT Guidelines</text>

  <!-- Tire Crown Profile Diagram -->
  <path d="M 60 250 C 60 180, 80 120, 150 110 C 210 100, 290 100, 350 110 C 420 120, 440 180, 440 250" 
        fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>

  <!-- Crown Repairable Zone (Green Highlight) -->
  <path d="M 160 108 C 210 101, 290 101, 340 108" 
        fill="none" stroke="#10b981" stroke-width="34" stroke-linecap="round"/>
  
  <text x="250" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">✅ SAFE TO PATCH / PLUG ($45-$65)</text>
  <text x="250" y="96" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Center Crown Area (Between Outer Grooves)</text>

  <!-- Left Shoulder/Sidewall Danger Zone (Red) -->
  <path d="M 70 230 C 70 180, 85 130, 140 114" 
        fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Right Shoulder/Sidewall Danger Zone (Red) -->
  <path d="M 360 114 C 415 130, 430 180, 430 230" 
        fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>

  <text x="95" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">❌ SIDEWALL / SHOULDER</text>
  <text x="95" y="292" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">NEVER PATCH • MUST REPLACE</text>

  <text x="405" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">❌ SIDEWALL / SHOULDER</text>
  <text x="405" y="292" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">NEVER PATCH • MUST REPLACE</text>

  <!-- Steer Tire Warning Note -->
  <rect x="130" y="170" width="240" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">⚠️ STEER TIRES EXCEPTION</text>
  <text x="250" y="202" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">DOT prohibits plugged steer tires. Must swap!</text>
</svg>
