<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="320" fill="#0b1120" rx="12"/>
  <rect x="10" y="10" width="480" height="300" fill="#131c31" rx="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="250" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Freightliner DPF &amp; DEF Dashboard Warning Stages</text>
  <text x="250" y="56" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Detroit DD13 / DD15 Instrument Cluster Icons</text>

  <!-- Stage 1 Card: Solid Amber -->
  <rect x="30" y="80" width="130" height="200" rx="8" fill="#1c253b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="95" cy="120" r="26" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2"/>
  <text x="95" y="126" font-size="22" text-anchor="middle">💨</text>
  <text x="95" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">STAGE 1</text>
  <text x="95" y="184" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">SOLID AMBER</text>
  <text x="95" y="210" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Soot High Level</text>
  <text x="95" y="230" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Drive on highway</text>
  <text x="95" y="245" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">at 55+ MPH for</text>
  <text x="95" y="260" font-family="sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">Auto-Regen</text>

  <!-- Stage 2 Card: Flashing Amber -->
  <rect x="185" y="80" width="130" height="200" rx="8" fill="#1c253b" stroke="#ea580c" stroke-width="2"/>
  <circle cx="250" cy="120" r="26" fill="rgba(234, 88, 12, 0.2)" stroke="#ea580c" stroke-width="2"/>
  <text x="250" y="126" font-size="22" text-anchor="middle">⚠️</text>
  <text x="250" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">STAGE 2</text>
  <text x="250" y="184" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">FLASHING AMBER</text>
  <text x="250" y="210" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Critical Soot Level</text>
  <text x="250" y="230" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f97316" text-anchor="middle">PARKED REGEN</text>
  <text x="250" y="245" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Mandatory within</text>
  <text x="250" y="260" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">1-2 hours</text>

  <!-- Stage 3 Card: Flashing + Red Stop Engine -->
  <rect x="340" y="80" width="130" height="200" rx="8" fill="#1c253b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="405" cy="120" r="26" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="2"/>
  <text x="405" y="126" font-size="22" text-anchor="middle">🛑</text>
  <text x="405" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">STAGE 3 (DERATE)</text>
  <text x="405" y="184" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">RED STOP ENGINE</text>
  <text x="405" y="210" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">55 / 5 MPH Derate</text>
  <text x="405" y="230" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Driver locked out</text>
  <text x="405" y="245" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Requires shop tool</text>
  <text x="405" y="260" font-family="sans-serif" font-size="9" fill="#f87171" text-anchor="middle">Detroit DDDL Reset</text>
</svg>
