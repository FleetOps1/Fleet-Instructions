<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="towBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0a"/>
      <stop offset="100%" stop-color="#241010"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1414"/>
      <stop offset="100%" stop-color="#1a0c0c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#towBg)" rx="12"/>
  <rect width="958" height="518" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12"/>

  <!-- Top Title Banner -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="40" height="32" rx="6" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="22" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">🚨</text>
    <text x="52" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.01em">ROADSIDE BREAKDOWN &amp; HEAVY TOWING SAFETY PROTOCOL</text>
    <text x="52" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">DOT 392.22 Triangle Deployment, Driver Highway Safety &amp; DT12 Axle Shaft Removal</text>
  </g>

  <!-- 4 Step Detailed Panels -->

  <!-- Panel 1: Driver Life Safety First -->
  <g transform="translate(32, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#451a1a" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#381515"/>
    <text x="12" y="20" fill="#f87171" font-family="system-ui" font-size="10.5" font-weight="800">1. DRIVER LIFE SAFETY</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#f87171">Immediate Actions:</text>
      <text x="0" y="27">• Steer as far right onto the</text>
      <text x="0" y="40">  shoulder / grass as possible.</text>
      <text x="0" y="55">• Turn ON 4-way hazard flashers.</text>
      <text x="0" y="70" fill="#fbbf24">• Put on high-visibility reflective</text>
      <text x="0" y="83" fill="#fbbf24">  vest BEFORE stepping out!</text>

      <line x1="0" y1="95" x2="188" y2="95" stroke="#451a1a"/>

      <text x="0" y="111" font-weight="700" fill="#ef4444">STRICT SAFETY RULE:</text>
      <text x="0" y="126">• NEVER stand between tractor and</text>
      <text x="0" y="139">  trailer on the shoulder!</text>
      <text x="0" y="154">• NEVER stand next to traffic lane.</text>
      <text x="0" y="169">• Wait inside cab with seatbelt on,</text>
      <text x="0" y="182">  or stand behind steel guardrail</text>
      <text x="0" y="195">  well away from passing traffic.</text>
    </g>
  </g>

  <!-- Panel 2: Triangle Deployment DOT 392.22 -->
  <g transform="translate(260, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#451a1a" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#381515"/>
    <text x="12" y="20" fill="#f87171" font-family="system-ui" font-size="10.5" font-weight="800">2. TRIANGLE SPACING</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#fbbf24">Mandatory 10-Minute Rule:</text>
      <text x="0" y="27">DOT 49 CFR § 392.22 requires 3</text>
      <text x="0" y="40">reflective triangles placed within</text>
      <text x="0" y="53">10 minutes of stopping.</text>

      <line x1="0" y1="65" x2="188" y2="65" stroke="#451a1a"/>

      <text x="0" y="80" font-weight="700" fill="#f8fafc">1. Triangle 1 (10 Feet):</text>
      <text x="0" y="94">• 10 ft directly behind truck on the</text>
      <text x="0" y="107">  traffic-facing edge of tractor/box.</text>

      <text x="0" y="125" font-weight="700" fill="#f8fafc">2. Triangle 2 (100 Feet):</text>
      <text x="0" y="139">• 100 ft (approx 40 paces) back,</text>
      <text x="0" y="152">  centered on the paved shoulder.</text>

      <text x="0" y="170" font-weight="700" fill="#f8fafc">3. Triangle 3 (200 Feet):</text>
      <text x="0" y="184">• 200 ft (approx 80 paces) back,</text>
      <text x="0" y="197">  facing oncoming highway traffic.</text>
      <text x="0" y="210" fill="#94a3b8">(Hill or curve: move up to 500 ft).</text>
    </g>
  </g>

  <!-- Panel 3: Dispatch Breakdown Coordinates -->
  <g transform="translate(488, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="#451a1a" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#381515"/>
    <text x="12" y="20" fill="#38bdf8" font-family="system-ui" font-size="10.5" font-weight="800">3. DISPATCH REPORTING</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <text x="0" y="12" font-weight="700" fill="#38bdf8">Dispatch Checklist:</text>
      <text x="0" y="27">Send 24/7 Safety / Breakdown:</text>

      <line x1="0" y1="40" x2="188" y2="40" stroke="#451a1a"/>

      <text x="0" y="56" font-weight="700" fill="#f8fafc">1. Location Details:</text>
      <text x="0" y="71">• Exact Interstate / Highway #</text>
      <text x="0" y="86">• Direction of travel (NB/SB/EB/WB)</text>
      <text x="0" y="101">• Nearest Mile Marker post</text>
      <text x="0" y="116">• Nearest Exit # / Landmark</text>
      <text x="0" y="131">• Share live GPS pin via phone</text>

      <line x1="0" y1="145" x2="188" y2="145" stroke="#451a1a"/>

      <text x="0" y="161" font-weight="700" fill="#f8fafc">2. Load &amp; Weight Status:</text>
      <text x="0" y="176">• Loaded or Empty trailer</text>
      <text x="0" y="191">• Approximate gross vehicle weight</text>
      <text x="0" y="206">• Hazmat status (Yes/No)</text>
      <text x="0" y="221">• Reefer temperature if refrigerated</text>
    </g>
  </g>

  <!-- Panel 4: DT12 Transmission Towing Rule -->
  <g transform="translate(716, 78)">
    <rect width="212" height="412" rx="8" fill="url(#cardGrad)" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
    <rect width="212" height="30" rx="8" fill="#450a0a"/>
    <rect width="212" height="2" y="29" fill="#ef4444"/>
    <text x="12" y="20" fill="#fca5a5" font-family="system-ui" font-size="10.5" font-weight="800">4. DT12 TOW PROTECTION</text>

    <g transform="translate(12, 42)" font-family="system-ui" font-size="9.5" fill="#cbd5e1">
      <rect x="0" y="0" width="188" height="24" rx="4" fill="rgba(239,68,68,0.3)"/>
      <text x="8" y="16" font-weight="800" fill="#fca5a5">🚨 $15,000 TOWING RULE:</text>

      <text x="0" y="38" font-weight="700" fill="#f87171">DT12 Automated Transmission:</text>
      <text x="0" y="53">• If rear wheels spin during tow</text>
      <text x="0" y="66">  without engine running, the internal</text>
      <text x="0" y="79">  oil pump DOES NOT circulate oil!</text>
      <text x="0" y="94" fill="#ef4444" font-weight="700">• Transmission burns and seizes</text>
      <text x="0" y="107" fill="#ef4444" font-weight="700">  within 5 miles!</text>

      <line x1="0" y1="120" x2="188" y2="120" stroke="#451a1a"/>

      <text x="0" y="136" font-weight="700" fill="#fbbf24">Mandatory Tow Prep:</text>
      <text x="0" y="151">1. Wrecker MUST pull rear axle</text>
      <text x="0" y="164">   half-shafts (drive axle shafts)</text>
      <text x="0" y="177">   OR disconnect main driveshaft.</text>
      <text x="0" y="193">2. Install axle cover caps to keep</text>
      <text x="0" y="206">   differential fluid from spilling.</text>
      <text x="0" y="222">3. Hook up wrecker auxiliary air line</text>
      <text x="0" y="235">   to release spring parking brakes.</text>
    </g>
  </g>
</svg>